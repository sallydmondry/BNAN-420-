# Render.com blueprint (free tier). Connect the GitHub repo, then "New > Blueprint" picks this up.
services:
  - type: web
    name: trueoffer
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_MODE
        value: "off"            # fully local; no API key needed
      - key: RATE_LIMIT_PER_MINUTE
        value: "12"
      - key: MAX_CONCURRENT_RUNS
        value: "4"
      - key: CORS_ORIGINS
        value: ""
